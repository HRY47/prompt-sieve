[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-sieve"
version = "0.2.0"
description = "PromptSieve: experimental token-aware prompt and log compression with preservation checks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
openai = ["tiktoken>=0.7", "openai>=1.40"]
anthropic = ["anthropic>=0.40"]
hf = ["tokenizers>=0.15", "transformers>=4.40"]
lingua = ["llmlingua>=0.2.2", "transformers>=4.40,<6"]
argos = ["argostranslate>=1.9"]
nllb = ["transformers>=4.40,<6", "torch", "sentencepiece"]
all = ["tiktoken>=0.7", "openai>=1.40", "anthropic>=0.40", "tokenizers>=0.15", "transformers>=4.40,<6", "llmlingua>=0.2.2", "argostranslate>=1.9", "sentencepiece"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/HRY47/prompt-sieve"

[project.scripts]
prompt-sieve = "promptsieve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptsieve = ["integrations/skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires explicitly enabled optional dependencies and model data"]
