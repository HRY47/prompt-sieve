name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest moved to 26.04, which has no setup-python builds for
          # older interpreters. Pin the image so the matrix stays reproducible.
          - {os: ubuntu-24.04, python: '3.10'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -v
      - run: prompt-sieve doctor
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify wheel contents and clean installation
        shell: python
        run: |
          import configparser
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import zipfile

          wheel = next(Path("dist").glob("prompt_sieve-*.whl")).resolve()
          with zipfile.ZipFile(wheel) as archive:
              roots = {name.split("/")[0] for name in archive.namelist()}
              metadata_dir = next(name for name in roots if name.endswith(".dist-info"))
              assert roots == {"promptsieve", metadata_dir}, roots
              entries = configparser.ConfigParser()
              entries.read_string(archive.read(f"{metadata_dir}/entry_points.txt").decode())
              assert dict(entries["console_scripts"]) == {"prompt-sieve": "promptsieve.cli:main"}
          with tempfile.TemporaryDirectory() as directory:
              environment = Path(directory) / "venv"
              subprocess.run([sys.executable, "-m", "venv", str(environment)], check=True)
              scripts = environment / ("Scripts" if os.name == "nt" else "bin")
              python = scripts / ("python.exe" if os.name == "nt" else "python")
              cli = scripts / ("prompt-sieve.exe" if os.name == "nt" else "prompt-sieve")
              subprocess.run([str(python), "-m", "pip", "install", str(wheel)], check=True, cwd=directory)
              for command in ("--help", "doctor"):
                  subprocess.run([str(cli), command], check=True, cwd=directory)
              subprocess.run([str(python), "-c", "from promptsieve import optimize; from importlib.metadata import version; print(version('prompt-sieve'))"], check=True, cwd=directory)
  tokenizer:
    runs-on: ubuntu-24.04
    env:
      PROMPTSIEVE_TEST_TOKENIZERS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[openai,dev]"
      - run: python -m pytest tests/test_integrations.py -v -k tiktoken
